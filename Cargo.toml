[package]
name = "pocket-tts-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Erwan Barat <erwan.barat@example.com>"]
description = "Pocket TTS Rust engine for Android - Unifia mobile port"
license = "MIT"
repository = "https://github.com/Rwanbt/pocket-tts-mobile"
readme = "README.md"
publish = false

[lib]
name = "pocket_tts_mobile"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Moteur ptts depuis le fork épinglé (compatible avec les checkpoints Kyutai)
ptts = { git = "https://github.com/gabrieldemarmiesse/xn-ptts", rev = "7efa26973f81bba42cf2ace8da2c1eb9b605d54d", default-features = false, features = ["hf", "audio"] }
# Dépendance xn (tensor library)
xn = "0.2.11"

# Sérialisation (YAML/JSON)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Lecture des configs YAML Kyutai (adaptateur)
serde_yaml = "0.9"

# Gestion des erreurs
anyhow = "1.0"

# Logging (compatible Android via android_logger)
tracing = "0.1"

# Pour le FFI et la compatibilité C
libloading = "0.8"

# Pour la génération aléatoire (bruit, température)
rand = "0.8"

# Pour la gestion des chemins et des fichiers
path-clean = "1.0"

[features]
default = []
# Feature pour le build Android
android = []

[dev-dependencies]
# Pour les tests unitaires
mockall = "0.11"
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-android]
inherits = "release"
# Optimisations pour Android (ARMv8.2)
codegen-units = 1
panic = "abort"

